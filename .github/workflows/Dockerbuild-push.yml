#goals:build and push the docker image after code lint is doone
name: docker build and push
on: 
  push: 
    branches: [master]

jobs:
  build-puah:
   runs-on: ubuntu-latest
   steps:
     - name: checkout code
       uses: actions/checkout@7

     - name: docker setup[login]
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Install node.js dependences
       run: npm ci

     - name: Run linters
       uses: wearerequired/lint-action@v2
       with:
         eslint: true
         prettier: true 
       
  
